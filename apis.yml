aid: conduct-ai
name: Conduct AI
description: Conduct AI (conduct.ai) is an enterprise "AI operating system" that helps IT teams understand,
  operate, and transform their business software, starting with SAP and expanding across the wider enterprise
  stack. Its platform analyzes custom code to reveal dependencies and system relationships (Understand),
  automates software-development workflows from planning through deployment (Operate), and accelerates
  system migrations such as S/4HANA with automated analysis and code refactoring (Transform). The company
  markets outcomes like faster S/4HANA migration planning, reduced manual system analysis, and shorter
  change-implementation cycles. Conduct raised a $60M Series A and is backed by ICONIQ Capital. It publishes
  a marketing site, blog, and case studies but does not currently expose a public developer API, SDKs,
  or API reference documentation.
